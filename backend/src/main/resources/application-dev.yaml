server:
  port: 8080
  servlet:
    context-path: /v1/

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/miniaturium
    username: admin
    password: ${DB_PASS}
    driver-class-name: org.mariadb.jdbc.Driver

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE